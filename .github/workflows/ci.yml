name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR instead of letting them pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: this pipeline only reads the repository and uploads its own
# artifacts. No job needs write access to contents, packages, or deployments.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  build-and-test:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` uses package-lock.json exactly as committed — reproducible installs, no
      # unexpected version drift between local dev, CI, and the Docker build.
      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check (non-template TypeScript)
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Unit tests
        run: npm test -- --watch=false

      # Full type checking (including Angular templates) happens here too — a template type
      # error fails the build, not just this step.
      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Informational only: a vulnerable transitive dev dependency shouldn't block every PR by
      # itself, but it should be visible. See SECURITY.md for how findings are triaged.
      - name: Dependency audit (informational)
        run: npm audit --audit-level=high
        continue-on-error: true

      # Runs the open-source gitleaks CLI directly (rather than the gitleaks-action wrapper,
      # which requires a paid license on private repositories) so this step works regardless of
      # repository visibility.
      - name: Secret scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            zricethezav/gitleaks:latest detect --redact -v
