<div class="mx-auto max-w-6xl px-4 py-16 sm:px-6 lg:px-8">
  <div class="max-w-2xl">
    <h2 class="text-3xl font-bold tracking-tight text-navy-900 sm:text-4xl">
      Pensado para que tomes mejores decisiones
    </h2>
    <p class="mt-3 text-navy-700">
      Estos son los principios detrás de la experiencia que PrestaMesta busca ofrecer.
    </p>
  </div>

  <ul class="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
    @for (benefit of benefits; track benefit.title) {
      <li>
        <article
          class="h-full rounded-2xl border border-navy-100 bg-white p-6 shadow-sm transition-shadow hover:shadow-md"
        >
          <div class="inline-flex rounded-xl bg-emerald-50 p-3 text-emerald-700">
            <app-icon [name]="benefit.icon" [size]="24" />
          </div>
          <h3 class="mt-4 text-lg font-semibold text-navy-900">{{ benefit.title }}</h3>
          <p class="mt-2 text-sm text-navy-700">{{ benefit.description }}</p>
        </article>
      </li>
    }
  </ul>
</div>
