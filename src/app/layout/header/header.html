<header class="sticky top-0 z-40 border-b border-navy-100 bg-white/90 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <a
      routerLink="/"
      fragment="inicio"
      class="rounded-md focus-visible:outline-none"
      aria-label="PrestaMesta, ir al inicio"
    >
      <app-logo />
    </a>

    <nav class="hidden lg:flex lg:items-center lg:gap-8" aria-label="Principal">
      @for (link of navLinks; track link.fragment) {
        <a
          routerLink="/"
          [fragment]="link.fragment"
          class="text-sm font-medium text-navy-700 transition-colors hover:text-emerald-700"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <a
      routerLink="/"
      fragment="descarga"
      class="hidden items-center gap-2 rounded-full bg-emerald-700 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-emerald-800 lg:inline-flex"
    >
      <app-icon name="download" [size]="18" />
      Descargar APK
    </a>

    <button
      #menuToggle
      type="button"
      class="inline-flex items-center justify-center rounded-md p-2 text-navy-700 lg:hidden"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="mobile-menu-panel"
      (click)="toggleMenu()"
    >
      <span class="sr-only">{{ isMenuOpen() ? 'Cerrar menú' : 'Abrir menú' }}</span>
      <app-icon [name]="isMenuOpen() ? 'close' : 'menu'" [size]="26" />
    </button>
  </div>

  <div class="lg:hidden" [hidden]="!isMenuOpen()">
    <div
      class="fixed inset-0 top-16 z-30 bg-navy-950/40"
      aria-hidden="true"
      (click)="closeMenu()"
    ></div>
    <nav
      #menuPanel
      id="mobile-menu-panel"
      [appFocusTrap]="isMenuOpen()"
      class="fixed inset-x-0 top-16 z-40 max-h-[calc(100dvh-4rem)] overflow-y-auto border-b border-navy-100 bg-white p-6 shadow-lg"
      aria-label="Menú móvil"
    >
      <ul class="flex flex-col gap-1">
        @for (link of navLinks; track link.fragment) {
          <li>
            <a
              routerLink="/"
              [fragment]="link.fragment"
              (click)="closeMenu()"
              class="block rounded-md px-3 py-3 text-base font-medium text-navy-800 hover:bg-navy-50"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
      <a
        routerLink="/"
        fragment="descarga"
        (click)="closeMenu()"
        class="mt-4 flex items-center justify-center gap-2 rounded-full bg-emerald-700 px-5 py-3 text-base font-semibold text-white"
      >
        <app-icon name="download" [size]="18" />
        Descargar APK
      </a>
    </nav>
  </div>
</header>
