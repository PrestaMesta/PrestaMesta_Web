<div
  class="flex flex-col items-center justify-center rounded-2xl border border-dashed border-navy-200 bg-white px-6 py-16 text-center"
>
  <span class="flex h-12 w-12 items-center justify-center rounded-full bg-navy-50 text-navy-500">
    <app-icon [name]="icon()" [size]="24" />
  </span>
  <h2 class="mt-4 text-lg font-semibold text-navy-900">{{ title() }}</h2>
  <p class="mt-2 max-w-md text-sm text-navy-600">{{ message() }}</p>
</div>
