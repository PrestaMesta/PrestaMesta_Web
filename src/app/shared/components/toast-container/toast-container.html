<div
  aria-live="polite"
  role="status"
  class="pointer-events-none fixed inset-x-0 bottom-4 z-50 flex flex-col items-center gap-2 px-4"
>
  @for (toast of toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex max-w-sm items-center gap-3 rounded-xl bg-navy-900 px-4 py-3 text-sm text-white shadow-lg"
    >
      <span>{{ toast.message }}</span>
      <button
        type="button"
        class="text-navy-300 hover:text-white"
        aria-label="Cerrar notificación"
        (click)="dismiss(toast.id)"
      >
        &times;
      </button>
    </div>
  }
</div>
